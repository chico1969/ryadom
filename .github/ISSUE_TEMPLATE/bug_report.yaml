name: Ошибка
description: Воспроизводимая проблема в «Рядом»
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: "Не публикуйте пароли, ключи, полные SDP и личные логи. Об уязвимостях сообщайте по SECURITY.md."
  - type: input
    id: build
    attributes:
      label: Версия или SHA256 сборки
    validations:
      required: true
  - type: input
    id: systems
    attributes:
      label: Windows на обоих ПК, Portable или Setup
      placeholder: "Например: Windows 11 Pro / Portable → Windows 10 Home / Setup"
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Маршрут в программе
      options:
        - Не удалось подключиться
        - P2P IPv4
        - P2P IPv6
        - TURN
        - Не знаю
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги, ожидаемый и фактический результат
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Дополнительные условия
      description: Мониторы, DPI, сеть, обрыв связи, UAC. Скриншоты только без личных данных.
