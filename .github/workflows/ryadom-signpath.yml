name: Ryadom SignPath preparation and signing
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part product version, for example 0.1.0.1'
        required: true
        default: '0.1.0.1'
      sign:
        description: 'Request production signing (requires SignPath approval and configuration)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ryadom-signpath
  cancel-in-progress: false
jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml
  windows:
    needs: bridge
    runs-on: windows-2022
    timeout-minutes: 180
    environment: signpath-release
    env:
      RYADOM_BUILD: '1'
      RYADOM_SIGNING_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate release configuration
        shell: pwsh
        env:
          REQUEST_SIGNING: ${{ inputs.sign }}
          SIGNING_ENABLED: ${{ vars.RYADOM_SIGNPATH_ENABLED }}
          CERTIFICATE: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: |
          if($env:GITHUB_REPOSITORY -ne 'chico1969/ryadom'){throw 'This workflow is configured for chico1969/ryadom only'}
          if($env:RYADOM_SIGNING_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$' -or @($env:RYADOM_SIGNING_VERSION.Split('.') | Where-Object {[int64]$_ -gt 65535}).Count){throw 'Invalid product version'}
          if($env:REQUEST_SIGNING -eq 'true' -and ($env:SIGNING_ENABLED -ne 'true' -or $env:CERTIFICATE -notmatch '^[a-fA-F0-9]{40}$')){throw 'Production signing is not approved/configured'}
      - name: Apply pinned dependency patch
        shell: pwsh
        run: ./ryadom/prepare-submodule.ps1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: .
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: '15.0.6'
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: '3.24.5'
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      - name: Build native dependencies
        shell: pwsh
        run: ./ryadom/build-native-deps.ps1
      - name: Build from source without private TURN data
        shell: pwsh
        run: ./ryadom/build-windows.ps1
      - name: Archive corresponding sources
        shell: pwsh
        run: ./ryadom/package-development.ps1 -SkipWeb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Ryadom-unsigned-development-with-sources
          path: |
            dist/development/*.exe
            dist/development/Ryadom-Sources-development.zip
            LICENCE
            CODE_SIGNING.md
            PRIVACY.md
          if-no-files-found: error
      - name: Stage inner signing inputs
        shell: pwsh
        run: ./ryadom/signing/artifacts.ps1 -Stage stage-inner -Version $env:RYADOM_SIGNING_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: inner
        with:
          name: Ryadom-unsigned-inner
          path: .tools/signpath/unsigned-inner/*
          if-no-files-found: error
      - name: Request inner production signatures (manual approval in SignPath)
        if: ${{ inputs.sign }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ryadom
          signing-policy-slug: release
          artifact-configuration-slug: inner
          github-artifact-id: ${{ steps.inner.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: .tools/signpath/signed-inner
          parameters: |
            version: ${{ toJSON(inputs.version) }}
      - name: Package verified signed runtime
        if: ${{ inputs.sign }}
        shell: pwsh
        env:
          CERTIFICATE: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: ./ryadom/signing/artifacts.ps1 -Stage repack -Version $env:RYADOM_SIGNING_VERSION -CertificateThumbprint $env:CERTIFICATE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: outer
        if: ${{ inputs.sign }}
        with:
          name: Ryadom-unsigned-outer
          path: .tools/signpath/unsigned-outer/*
          if-no-files-found: error
      - name: Request outer production signatures (manual approval in SignPath)
        if: ${{ inputs.sign }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ryadom
          signing-policy-slug: release
          artifact-configuration-slug: outer
          github-artifact-id: ${{ steps.outer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: .tools/signpath/signed-outer
          parameters: |
            version: ${{ toJSON(inputs.version) }}
      - name: Verify production signatures and generate checksums
        if: ${{ inputs.sign }}
        shell: pwsh
        env:
          CERTIFICATE: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: ./ryadom/signing/artifacts.ps1 -Stage verify-release -Version $env:RYADOM_SIGNING_VERSION -CertificateThumbprint $env:CERTIFICATE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ inputs.sign }}
        with:
          name: Ryadom-signed-review-only
          path: dist/signpath/*
          if-no-files-found: error
